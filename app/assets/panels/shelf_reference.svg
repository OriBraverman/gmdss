<?xml version="1.0" encoding="UTF-8"?>
<!-- The reference book shelf with its books. Own drawing on the original's 613 x 390 layout;
     the lettering is fitted to the lengths measured there.
     Ids the app uses: book-0 .. book-7 (GMDSS handbook, map of coast stations, lists VIIA, VI,
     V 1-L, V M-Z, IV, self education). Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="613" height="390" viewBox="0 0 613 390"
     font-family="DejaVu Sans">
  <defs>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a3414"/>
      <stop offset="0.35" stop-color="#9a5624"/>
      <stop offset="1" stop-color="#5a2c10"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a30"/>
      <stop offset="0.45" stop-color="#8a4c1e"/>
      <stop offset="1" stop-color="#5a2c10"/>
    </linearGradient>
    <!-- Spine shading: light on the left, shadow on the right. -->
    <linearGradient id="round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grain" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#16492f"/>
      <rect width="1" height="1" fill="#2a6a48"/>
      <rect x="1" y="1" width="1" height="1" fill="#1f5c3c"/>
    </pattern>
    <!-- The faint net on the blue and green volumes. -->
    <pattern id="net" width="44" height="52" patternUnits="userSpaceOnUse">
      <path d="M0,40 Q22,22 44,34 M-4,12 Q20,2 48,10 M8,0 Q22,26 14,52 M34,0 Q26,28 38,52" fill="none" stroke="#9ab4ff" stroke-width="0.9" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="613" height="390" fill="#000"/>

  <!-- Book ends and board. -->
  <rect x="4" y="221" width="35" height="131" fill="url(#end)"/>
  <rect x="575" y="221" width="35" height="131" fill="url(#end)"/>
  <path d="M12,230 Q16,280 13,345 M24,225 Q28,290 23,350 M583,232 Q587,282 584,346 M597,226 Q600,292 596,350" fill="none" stroke="#3a1c08" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="2" y="352" width="609" height="36" fill="url(#board)"/>
  <path d="M2,352.5 H611" stroke="#d08a48" stroke-width="1.5"/>
  <path d="M20,366 Q140,362 260,368 T480,365 T605,367 M40,378 Q200,375 360,379 T600,377" fill="none" stroke="#3a1c08" stroke-width="1" stroke-opacity="0.55"/>
  <ellipse cx="30" cy="372" rx="10" ry="3.5" fill="#2a1406" fill-opacity="0.7"/>
  <ellipse cx="425" cy="370" rx="12" ry="4" fill="#2a1406" fill-opacity="0.7"/>
  <ellipse cx="545" cy="373" rx="11" ry="3.5" fill="#2a1406" fill-opacity="0.7"/>

  <!-- 0: GMDSS handbook, front cover. -->
  <rect id="book-0" x="41" y="10" width="107" height="342" rx="2" fill="url(#grain)"/>
  <rect x="41" y="10" width="107" height="342" rx="2" fill="url(#round)"/>
  <rect x="55.5" y="86.5" width="75" height="77" fill="none" stroke="#f0d43c" stroke-width="1.6"/>
  <g font-weight="bold" fill="#f0d43c" text-anchor="middle" font-size="10.5">
    <text x="93" y="119" textLength="64" lengthAdjust="spacingAndGlyphs">G&#183;M&#183;D&#183;S&#183;S</text>
    <text x="93" y="134" textLength="66" lengthAdjust="spacingAndGlyphs">Handbook</text>
  </g>

  <!-- 1: map of coast stations, leaning on the handbook. -->
  <path id="book-1" d="M172,352 L192,352 L170,5 L150,5 Z" fill="#e6e8ea"/>
  <path d="M172,352 L176,352 L154,5 L150,5 Z" fill="#fff" fill-opacity="0.6"/>
  <path d="M188,352 L192,352 L170,5 L166,5 Z" fill="#9aa0a8" fill-opacity="0.5"/>
  <text transform="translate(184.5,300) rotate(-93.6)" font-size="11.5" fill="#4c96dc" textLength="178" lengthAdjust="spacingAndGlyphs">MAP COAST STATIONS</text>

  <!-- 2: list VIIA, call signs. -->
  <rect id="book-2" x="196" y="1" width="50" height="351" fill="#34965f"/>
  <rect x="196" y="1" width="50" height="351" fill="url(#round)"/>
  <text x="221" y="43" font-size="16" font-weight="bold" fill="#141414" text-anchor="middle">VIIA</text>
  <g font-size="13" font-weight="bold" fill="#10200f">
    <text transform="translate(217.5,274) rotate(-90)" textLength="130" lengthAdjust="spacingAndGlyphs">LIST OF CALL SIGNS</text>
    <text transform="translate(233.5,274) rotate(-90)" textLength="187" lengthAdjust="spacingAndGlyphs">AND NUMERICAL IDENTITIES</text>
  </g>

  <!-- 3: list VI, radiodetermination and special service stations. -->
  <rect id="book-3" x="247" y="1" width="53" height="351" fill="#f48424"/>
  <rect x="247" y="1" width="53" height="351" fill="url(#round)"/>
  <text x="273" y="43" font-size="16" font-weight="bold" fill="#141414" text-anchor="middle">VI</text>
  <g font-size="12.5" font-weight="bold" fill="#2a1406">
    <text transform="translate(270,285) rotate(-90)" textLength="209" lengthAdjust="spacingAndGlyphs">LIST OF RADIODETERMINATION</text>
    <text transform="translate(286.5,285) rotate(-90)" textLength="209" lengthAdjust="spacingAndGlyphs">AND SPECIAL SERVICE STATIONS</text>
  </g>

  <!-- 4, 5: list V, ship stations, two volumes. -->
  <rect id="book-4" x="302" y="1" width="66" height="351" fill="#1a2a8c"/>
  <rect id="book-5" x="370" y="1" width="62" height="351" fill="#1a2a8c"/>
  <rect x="302" y="1" width="66" height="351" fill="url(#net)"/>
  <rect x="370" y="1" width="62" height="351" fill="url(#net)"/>
  <rect x="302" y="1" width="66" height="351" fill="url(#round)"/>
  <rect x="370" y="1" width="62" height="351" fill="url(#round)"/>
  <g font-size="6.5" font-weight="bold" fill="#78bef0" text-anchor="middle">
    <text x="335" y="16">34th</text><text x="335" y="24">EDITION</text>
    <text x="401" y="16">34th</text><text x="401" y="24">EDITION</text>
    <text x="463.5" y="16">34th</text><text x="463.5" y="24">EDITION</text>
  </g>
  <g font-size="15" fill="#d8e0f6" text-anchor="middle">
    <text x="335" y="47">V</text><text x="401" y="47">V</text>
  </g>
  <rect x="302" y="59" width="66" height="29" fill="#f28028"/>
  <rect x="370" y="59" width="62" height="29" fill="#f28028"/>
  <g font-size="19" font-weight="bold" fill="#fdf8ee" text-anchor="middle">
    <text x="335" y="80.5" textLength="48" lengthAdjust="spacingAndGlyphs">1 - L</text>
    <text x="401" y="80.5" textLength="50" lengthAdjust="spacingAndGlyphs">M - Z</text>
  </g>
  <g font-size="19" fill="#dce2f4">
    <text transform="translate(329.5,227) rotate(-90)" textLength="55" lengthAdjust="spacingAndGlyphs">SHIP</text>
    <text transform="translate(355.5,245) rotate(-90)" textLength="97" lengthAdjust="spacingAndGlyphs">STATIONS</text>
    <text transform="translate(397.5,227) rotate(-90)" textLength="55" lengthAdjust="spacingAndGlyphs">SHIP</text>
    <text transform="translate(423.5,245) rotate(-90)" textLength="97" lengthAdjust="spacingAndGlyphs">STATIONS</text>
  </g>

  <!-- 6: list IV, coast stations. -->
  <rect id="book-6" x="435" y="1" width="57" height="351" fill="#28805a"/>
  <rect x="435" y="1" width="57" height="351" fill="url(#net)"/>
  <rect x="435" y="1" width="57" height="351" fill="url(#round)"/>
  <rect x="447" y="33" width="33" height="16" fill="#3a64a8"/>
  <text x="463.5" y="46.5" font-size="14" font-weight="bold" fill="#c8dcf0" text-anchor="middle">IV</text>
  <g font-size="21" fill="#3aa6ea">
    <text transform="translate(460,205) rotate(-90)" textLength="74" lengthAdjust="spacingAndGlyphs">COAST</text>
    <text transform="translate(485,222) rotate(-90)" textLength="110" lengthAdjust="spacingAndGlyphs">STATIONS</text>
  </g>

  <!-- 7: self education. -->
  <rect id="book-7" x="496" y="59" width="70" height="293" fill="#2c62a8"/>
  <rect x="496" y="59" width="70" height="293" fill="url(#round)"/>
  <path d="M499,62 V349" stroke="#5a8ad0" stroke-width="1.5"/>
  <text transform="translate(539,297) rotate(-90)" font-size="17" font-weight="bold" fill="#e8a040" stroke="#3a2008" stroke-width="0.5" textLength="177" lengthAdjust="spacingAndGlyphs">SELF EDUCATION</text>
</svg>
