<?xml version="1.0" encoding="UTF-8"?>
<!-- Inmarsat-A terminal: function key strip under the screen. Own drawing on the original's 539 x 80 layout.
     Ids the app uses: key-LINE key-RLS key-SES_CONT key-EDIT key-FLIST key-TRSFR key-WRU key-HERE_IS key-PRINT_ON,
     lamp-LINE lamp-RLS lamp-SES_CONT lamp-EDIT lamp-TRSFR lamp-PRINT_ON. Text uses DejaVu Sans. -->
<svg xmlns="http://www.w3.org/2000/svg" width="539" height="80" viewBox="0 0 539 80" font-family="DejaVu Sans">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d4b4"/>
      <stop offset="1" stop-color="#b8b496"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd659"/>
      <stop offset="1" stop-color="#d6a412"/>
    </linearGradient>
    <g id="cap">
      <rect x="0" y="0" width="36" height="34" rx="3" fill="#554d4d"/>
      <rect x="2" y="2" width="32" height="30" rx="2.5" fill="#be9200"/>
      <rect x="2" y="2" width="31" height="28.5" rx="2.5" fill="url(#key)"/>
    </g>
    <g id="lampOff"><rect width="6" height="6" rx="1" fill="#5a0004"/></g>
  </defs>
  <rect x="0" y="0" width="539" height="80" fill="#000"/>
  <rect x="2" y="0" width="535" height="78" rx="2" fill="url(#bar)"/>
  <path d="M12,11.5 H527" stroke="#8e8e75" stroke-width="1"/>
  <path d="M11.5,11 V57 M528.5,11 V57" stroke="#554d4d" stroke-width="1"/>

  <g font-size="6.5" font-weight="bold" fill="#000" text-anchor="middle">
    <g id="key-LINE" transform="translate(39,16)"><use href="#cap"/><text x="18" y="22">LINE</text></g>
    <g id="key-RLS" transform="translate(81,16)"><use href="#cap"/><text x="18" y="22">RLS</text></g>
    <g id="key-SES_CONT" transform="translate(167,16)"><use href="#cap"/><text x="18" y="17">SES</text><text x="18" y="25">CONT</text></g>
    <g id="key-EDIT" transform="translate(209,16)"><use href="#cap"/><text x="18" y="22">EDIT</text></g>
    <g id="key-FLIST" transform="translate(251,16)"><use href="#cap"/><text x="18" y="22">FLIST</text></g>
    <g id="key-TRSFR" transform="translate(336,16)"><use href="#cap"/><text x="18" y="22">TRSFR</text></g>
    <g id="key-WRU" transform="translate(378,16)"><use href="#cap"/><text x="18" y="22">WRU</text></g>
    <g id="key-HERE_IS" transform="translate(420,16)"><use href="#cap"/><text x="18" y="17">HERE</text><text x="18" y="25">IS</text></g>
    <g id="key-PRINT_ON" transform="translate(462,16)"><use href="#cap"/><text x="18" y="17">PRINT</text><text x="18" y="25">ON</text></g>
  </g>
  <use id="lamp-LINE" href="#lampOff" x="44" y="20"/>
  <use id="lamp-RLS" href="#lampOff" x="86" y="20"/>
  <use id="lamp-SES_CONT" href="#lampOff" x="172" y="20"/>
  <use id="lamp-EDIT" href="#lampOff" x="214" y="20"/>
  <use id="lamp-TRSFR" href="#lampOff" x="341" y="20"/>
  <use id="lamp-PRINT_ON" href="#lampOff" x="467" y="20"/>
</svg>
