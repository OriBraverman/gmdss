<?xml version="1.0" encoding="UTF-8"?>
<!-- 406 MHz EPIRB seen from above. Own drawing on the original's 417 x 480 layout.
     Ids the app uses: lamp-strobe, lamp-red, switch (left half AUTO, right half ON), key-TEST.
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="417" height="480" viewBox="0 0 417 480"
     font-family="DejaVu Sans">
  <defs>
    <radialGradient id="dome" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f0f0ee"/>
      <stop offset="0.75" stop-color="#cfcfcc"/>
      <stop offset="1" stop-color="#a2a29e"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e2df"/>
      <stop offset="1" stop-color="#c8c8c4"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9bcbf"/>
      <stop offset="1" stop-color="#5f6266"/>
    </radialGradient>
    <radialGradient id="bolt" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c98a64"/>
      <stop offset="1" stop-color="#6e4a36"/>
    </radialGradient>
    <linearGradient id="hank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08040"/>
      <stop offset="0.5" stop-color="#d9601e"/>
      <stop offset="1" stop-color="#a8430f"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="225" cy="192" r="172"/></clipPath>
    <g id="boltHead"><circle r="8" fill="#7a6a60"/><circle r="6.2" fill="url(#bolt)"/></g>
    <g id="vent">
      <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#d6d6d2" stroke="#b4b4b0" stroke-width="1"/>
      <path d="M-24,-12 H24 M-24,-6 H24 M-24,0 H24 M-24,6 H24 M-24,12 H24" stroke="#4a4a48" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="417" height="480" fill="#000"/>

  <!-- Housing: rim, orange band, square label plate. -->
  <circle cx="225" cy="192" r="181" fill="#8f8f8b"/>
  <circle cx="225" cy="192" r="176" fill="url(#dome)"/>
  <circle cx="225" cy="192" r="149" fill="none" stroke="#dd6a28" stroke-width="18"/>
  <g clip-path="url(#disc)">
    <rect x="105" y="47" width="280" height="273" rx="4" fill="url(#plate)" fill-opacity="0.93"/>
    <path d="M105,47 L385,320 M385,47 L105,320" stroke="#bdbdb9" stroke-width="1.2"/>
  </g>
  <g>
    <use href="#boltHead" x="225" y="20"/><use href="#boltHead" x="311" y="43"/><use href="#boltHead" x="374" y="106"/>
    <use href="#boltHead" x="397" y="192"/><use href="#boltHead" x="374" y="278"/><use href="#boltHead" x="311" y="341"/>
    <use href="#boltHead" x="225" y="364"/><use href="#boltHead" x="139" y="341"/><use href="#boltHead" x="76" y="278"/>
    <use href="#boltHead" x="53" y="192"/><use href="#boltHead" x="76" y="106"/><use href="#boltHead" x="139" y="43"/>
  </g>

  <!-- Vents either side of the red lamp. -->
  <use href="#vent" transform="translate(158,118) rotate(-30)"/>
  <use href="#vent" transform="translate(292,118) rotate(30)"/>

  <!-- Red indicator lamp in its housing. -->
  <path d="M199,96 A28,28 0 0 0 251,96 L251,132 A28,28 0 0 1 199,132 Z" fill="#c6c6c2"/>
  <rect x="211" y="101" width="27" height="26" rx="2" fill="#8c8c88"/>
  <circle cx="224.5" cy="114" r="8" fill="#d0601e"/>
  <circle id="lamp-red" cx="224.5" cy="114" r="5.5" fill="#3a0808"/>

  <!-- Strobe lens on its orange collar. -->
  <circle cx="225" cy="187" r="51" fill="#e0601e"/>
  <circle cx="225" cy="187" r="40" fill="#b84a14"/>
  <circle id="lamp-strobe" cx="225" cy="187" r="37" fill="url(#lens)"/>
  <circle cx="225" cy="187" r="9" fill="none" stroke="#8a8d90" stroke-width="2"/>

  <!-- Holes in the plate; the lower one is the test key. -->
  <g fill="none" stroke="#d0601e" stroke-width="2">
    <circle cx="225" cy="85" r="6"/><circle cx="120" cy="190" r="6"/><circle cx="330" cy="190" r="6"/>
  </g>
  <circle id="key-TEST" cx="225" cy="292" r="7" fill="#e0601e" stroke="#7a2a08" stroke-width="1.5"/>
  <text x="248" y="296" font-size="7" font-weight="bold" fill="#555">TEST</text>

  <!-- AUTO / ON switch with its pin. -->
  <circle cx="225" cy="260" r="21" fill="#e8e8e4" stroke="#8a8a86" stroke-width="1.2"/>
  <g id="switch" transform="translate(195,243)">
    <rect width="60" height="34" fill="#000" fill-opacity="0"/>
    <circle cx="30" cy="17" r="13" fill="#3a3a3a"/>
    <rect x="27" y="5" width="6" height="24" rx="2" fill="#c8c8c8"/>
  </g>
  <g font-size="9" font-weight="bold" fill="#444" text-anchor="middle">
    <text transform="translate(180,244) rotate(-50)">AUTO</text>
    <text transform="translate(270,244) rotate(50)">ON</text>
  </g>

  <!-- Lanyard: from the switch pin to the tab on the rim, then down to the coiled hank. -->
  <path d="M32,170 C20,166 14,178 18,190 C22,204 36,206 44,196 Z" fill="#dd6a28"/>
  <circle cx="30" cy="188" r="4" fill="#000"/>
  <path d="M222,262 C190,300 90,300 30,200" fill="none" stroke="#e0601e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28,196 C8,250 30,330 70,380 C85,398 95,405 104,410" fill="none" stroke="#e0601e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M100,404 C140,396 330,398 366,402 Q374,436 366,470 C330,474 140,476 100,466 Q92,436 100,404 Z" fill="url(#hank)"/>
  <g stroke="#9a3a0c" stroke-width="1.3" stroke-opacity="0.8">
    <path d="M104,412 H362 M102,420 H366 M100,428 H368 M100,436 H368 M100,444 H368 M101,452 H367 M102,460 H364"/>
  </g>
  <path d="M170,400 V472 M290,400 V472" stroke="#1a1a1a" stroke-width="5"/>
</svg>
