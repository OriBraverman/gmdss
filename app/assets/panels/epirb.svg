<?xml version="1.0" encoding="UTF-8"?>
<!-- 406 MHz EPIRB seen from above. Own drawing on the original's 417 x 480 layout.
     Ids the app uses: lamp-strobe, lamp-red, switch (left half AUTO, right half ON), key-TEST.
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="417" height="480" viewBox="0 0 417 480"
     font-family="DejaVu Sans">
  <defs>
    <radialGradient id="dome" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f2f2f0"/>
      <stop offset="0.7" stop-color="#c9c9c6"/>
      <stop offset="1" stop-color="#9a9a96"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9c2c8"/>
      <stop offset="1" stop-color="#6d7680"/>
    </radialGradient>
    <radialGradient id="bolt" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </radialGradient>
    <g id="boltHead"><circle r="7" fill="#7a7a76"/><circle r="5.5" fill="url(#bolt)"/></g>
  </defs>
  <rect width="417" height="480" fill="#1e2a33"/>

  <!-- Housing. -->
  <circle cx="208" cy="230" r="200" fill="#8f8f8b"/>
  <circle cx="208" cy="230" r="194" fill="url(#dome)"/>
  <g>
    <use href="#boltHead" x="208" y="48"/><use href="#boltHead" x="299" y="72"/><use href="#boltHead" x="366" y="139"/>
    <use href="#boltHead" x="390" y="230"/><use href="#boltHead" x="366" y="321"/><use href="#boltHead" x="299" y="388"/>
    <use href="#boltHead" x="208" y="412"/><use href="#boltHead" x="117" y="388"/><use href="#boltHead" x="50" y="321"/>
    <use href="#boltHead" x="26" y="230"/><use href="#boltHead" x="50" y="139"/><use href="#boltHead" x="117" y="72"/>
  </g>
  <!-- Vents. -->
  <g stroke="#555" stroke-width="2.2" stroke-linecap="round">
    <path d="M128,150 L150,128 M133,160 L160,133 M138,170 L170,138 M143,180 L180,143"/>
    <path d="M288,150 L266,128 M283,160 L256,133 M278,170 L246,138 M273,180 L236,143"/>
  </g>

  <!-- Strobe lens on its orange collar, red indicator lamp above. -->
  <circle cx="208" cy="230" r="62" fill="#e0601e"/>
  <circle cx="208" cy="230" r="52" fill="#b84a14"/>
  <circle id="lamp-strobe" cx="208" cy="230" r="44" fill="url(#lens)"/>
  <rect x="194" y="130" width="28" height="28" rx="3" fill="#d8d8d4" stroke="#777" stroke-width="1"/>
  <circle id="lamp-red" cx="208" cy="144" r="7" fill="#5a1010"/>

  <!-- AUTO / ON switch with its pin, and the test key. -->
  <circle cx="208" cy="335" r="22" fill="#d8d8d4" stroke="#777" stroke-width="1"/>
  <g id="switch" transform="translate(178,318)">
    <rect width="60" height="34" fill="#000" fill-opacity="0"/>
    <circle cx="30" cy="17" r="13" fill="#3a3a3a"/>
    <rect x="27" y="5" width="6" height="24" rx="2" fill="#c8c8c8"/>
  </g>
  <g font-size="9" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="166" y="331">AUTO</text>
    <text x="250" y="331">ON</text>
  </g>
  <circle id="key-TEST" cx="208" cy="374" r="10" fill="#e0601e" stroke="#7a2a08" stroke-width="1.5"/>
  <text x="208" y="394" font-size="7" font-weight="bold" fill="#333" text-anchor="middle">TEST</text>

  <!-- Lanyard. -->
  <path d="M20,250 C0,320 30,380 80,400 C140,425 190,430 240,440" fill="none" stroke="#e0601e" stroke-width="3"/>
  <g fill="none" stroke="#d0561a" stroke-width="5">
    <ellipse cx="300" cy="448" rx="70" ry="18"/>
    <ellipse cx="300" cy="448" rx="62" ry="14"/>
    <ellipse cx="300" cy="448" rx="54" ry="11"/>
  </g>
  <path d="M270,430 V466 M330,430 V466" stroke="#222" stroke-width="4"/>
</svg>
