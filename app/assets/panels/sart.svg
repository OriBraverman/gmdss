<?xml version="1.0" encoding="UTF-8"?>
<!-- Search and rescue radar transponder (SART). Own drawing on the original's 125 x 405 layout:
     cap, upper flange, middle body with the warning plate and the lamp lens, lower flange, lower body
     with its label plate, foot; the pole along the left.
     Ids the app uses: lamp (indicator lens), switch (on/off pin).
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="125" height="405" viewBox="0 0 125 405"
     font-family="DejaVu Sans">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4500e"/>
      <stop offset="0.28" stop-color="#ee7e30"/>
      <stop offset="0.55" stop-color="#f6a058"/>
      <stop offset="0.85" stop-color="#e07428"/>
      <stop offset="1" stop-color="#a8480c"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a03c12"/>
      <stop offset="0.22" stop-color="#c85a1c"/>
      <stop offset="0.3" stop-color="#ec7a2e"/>
      <stop offset="0.6" stop-color="#f49a50"/>
      <stop offset="1" stop-color="#c05a18"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.45" stop-color="#5a5a5a"/>
      <stop offset="0.6" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101810"/>
      <stop offset="0.45" stop-color="#3a4a3a"/>
      <stop offset="1" stop-color="#0c120c"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#101214"/>
    </radialGradient>
    <!-- The fine mottle of the original's moulded plastic. -->
    <pattern id="mottle" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" fill-opacity="0.08"/>
      <rect x="2" y="1" width="1" height="1" fill="#fff" fill-opacity="0.07"/>
      <rect x="1" y="2" width="1" height="1" fill="#000" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Pole along the left side. -->
  <rect x="4" y="18" width="17" height="232" fill="url(#pole)"/>
  <rect x="2" y="12" width="21" height="9" rx="2" fill="#1a241a"/>
  <path d="M6,13 H19" stroke="#5a6a5a" stroke-width="1"/>

  <!-- Cap. -->
  <path d="M30,97 V16 Q30,5 41,5 H101 Q112,5 112,16 V97 Z" fill="url(#orange)"/>
  <rect x="30" y="5" width="82" height="92" fill="url(#mottle)"/>
  <text x="71" y="36" font-size="11" font-weight="bold" fill="#141414" text-anchor="middle">SART</text>
  <rect x="62" y="40" width="44" height="3" fill="#141414"/>
  <rect x="92" y="88" width="18" height="10" fill="none" stroke="#3a1a08" stroke-width="0.8"/>
  <path d="M94,91 H108 M94,94 H108" stroke="#3a1a08" stroke-width="0.6"/>

  <!-- Upper flange with its black band. -->
  <path d="M22,97 H120 L123,104 V128 L118,136 H24 L17,128 V104 Z" fill="url(#orange)"/>
  <rect x="17" y="112" width="106" height="12" fill="url(#band)"/>
  <path d="M19,105 H121" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="24" cy="132" r="1.6" fill="#3a3a3a"/><circle cx="70" cy="133" r="1.6" fill="#3a3a3a"/><circle cx="116" cy="132" r="1.6" fill="#3a3a3a"/>

  <!-- Middle body: warning plate, label, lamp lens. -->
  <rect x="22" y="136" width="96" height="94" fill="url(#orange)"/>
  <rect x="22" y="136" width="96" height="94" fill="url(#mottle)"/>
  <rect x="28" y="150" width="48" height="67" fill="none" stroke="#2a1206" stroke-width="0.9"/>
  <text x="31" y="159" font-size="6" font-weight="bold" fill="#141414">WARNING</text>
  <!-- Pictogram: the SART on its pole, 1 m above the sea, on a raft. -->
  <path d="M31,204 Q36,200 41,204 Q46,208 51,204 Q56,200 61,204 Q66,208 71,204" fill="none" stroke="#141414" stroke-width="0.9"/>
  <path d="M31,209 Q36,205 41,209 Q46,213 51,209 Q56,205 61,209 Q66,213 71,209" fill="none" stroke="#141414" stroke-width="0.9"/>
  <path d="M33,198 L44,186 H58 L66,198 Z" fill="none" stroke="#141414" stroke-width="0.9"/>
  <path d="M50,186 V174" stroke="#141414" stroke-width="1"/>
  <rect x="48.5" y="168" width="3" height="7" fill="#141414"/>
  <path d="M62,178 V197 M60,181 L62,178 L64,181 M60,194 L62,197 L64,194" fill="none" stroke="#141414" stroke-width="0.8"/>
  <text x="64.5" y="190" font-size="6" fill="#141414">1m</text>
  <rect x="82" y="150" width="29" height="25" fill="none" stroke="#2a1206" stroke-width="0.9"/>
  <path d="M85,155 H108 M85,159 H108 M85,163 H108 M85,167 H104 M85,171 H106" stroke="#2a1206" stroke-width="0.7"/>
  <path d="M100,178 Q92,202 100,226 L113,226 V178 Z" fill="#2a1408"/>
  <ellipse id="lamp" cx="105" cy="202" rx="7" ry="21" fill="url(#lens)"/>

  <!-- Lower flange. -->
  <path d="M20,230 H120 L123,236 V243 L120,247 H20 L17,243 V236 Z" fill="url(#orange)"/>
  <rect x="17" y="238" width="106" height="6" fill="url(#band)"/>
  <circle cx="24" cy="233" r="1.6" fill="#3a3a3a"/><circle cx="116" cy="233" r="1.6" fill="#3a3a3a"/>
  <g id="switch" transform="translate(88,222)">
    <rect x="0" y="0" width="34" height="28" rx="3" fill="#000" fill-opacity="0"/>
    <rect x="3" y="11" width="28" height="6" rx="2" fill="#c41818"/>
    <rect x="10" y="7" width="7" height="14" rx="1.5" fill="#e02020"/>
  </g>

  <!-- Lower body with its label plate (lettering up the plate). -->
  <rect x="2" y="247" width="110" height="149" fill="url(#lower)"/>
  <rect x="2" y="247" width="110" height="149" fill="url(#mottle)"/>
  <rect x="76" y="260" width="35" height="134" fill="#f09a50" stroke="#2a1206" stroke-width="0.9"/>
  <rect x="93" y="264" width="15" height="126" fill="none" stroke="#2a1206" stroke-width="0.6"/>
  <text transform="translate(90,386) rotate(-90)" font-size="13" font-weight="bold" fill="#141414" textLength="118" lengthAdjust="spacingAndGlyphs">RESCUE  SART</text>
  <g font-size="4.6" fill="#141414">
    <text transform="translate(99.5,386) rotate(-90)" textLength="118" lengthAdjust="spacingAndGlyphs">9 GHz SEARCH AND RESCUE RADAR TRANSPONDER</text>
    <text transform="translate(106,386) rotate(-90)" textLength="118" lengthAdjust="spacingAndGlyphs">PULL PIN TO SWITCH ON - MOUNT 1 m ABOVE SEA</text>
  </g>

  <!-- Foot. -->
  <rect x="10" y="395" width="90" height="10" rx="2" fill="#8a3410"/>
</svg>
