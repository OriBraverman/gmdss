<?xml version="1.0" encoding="UTF-8"?>
<!-- Search and rescue radar transponder (SART). Own drawing on the original's 125 x 405 layout.
     Ids the app uses: lamp (indicator window), switch (on/off pin).
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="125" height="405" viewBox="0 0 125 405"
     font-family="DejaVu Sans">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8480e"/>
      <stop offset="0.3" stop-color="#f07a2c"/>
      <stop offset="0.55" stop-color="#ff9a52"/>
      <stop offset="1" stop-color="#a8400c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.4" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>
  <!-- Pole along the left side. -->
  <rect x="12" y="20" width="9" height="330" rx="4" fill="url(#dark)"/>

  <!-- Dome. -->
  <path d="M30,55 Q30,6 75,6 Q120,6 120,55 Z" fill="url(#orange)"/>
  <rect x="28" y="52" width="94" height="10" fill="#1d1d1d"/>
  <text x="76" y="40" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">SART</text>

  <!-- Upper body with the indicator window. -->
  <rect x="26" y="62" width="98" height="150" fill="url(#orange)"/>
  <rect x="26" y="62" width="98" height="4" fill="#000" fill-opacity="0.25"/>
  <rect x="80" y="76" width="36" height="32" rx="3" fill="#2a1a10"/>
  <rect id="lamp" x="84" y="80" width="28" height="24" rx="2" fill="#5a2c10"/>
  <text x="34" y="128" font-size="6" font-weight="bold" fill="#000">WARNING</text>
  <!-- Pictogram: lift the SART above the sea. -->
  <path d="M34,170 Q44,164 54,170 Q64,176 74,170" fill="none" stroke="#000" stroke-width="1.2"/>
  <path d="M44,166 L52,148 L60,166 M52,148 V136" fill="none" stroke="#000" stroke-width="1.2"/>
  <path d="M66,150 V136 M63,139 L66,136 L69,139" fill="none" stroke="#000" stroke-width="1"/>
  <text x="70" y="160" font-size="7" fill="#000">1 m</text>
  <rect x="84" y="132" width="30" height="36" fill="none" stroke="#000" stroke-width="0.8"/>
  <path d="M87,138 H111 M87,143 H111 M87,148 H111 M87,153 H111 M87,158 H111 M87,163 H105" stroke="#000" stroke-width="0.7"/>

  <!-- Switch band with the pin. -->
  <rect x="24" y="212" width="102" height="16" fill="#1d1d1d"/>
  <rect x="26" y="228" width="98" height="6" fill="#000" fill-opacity="0.3"/>
  <g id="switch" transform="translate(88,206)">
    <rect x="0" y="0" width="34" height="28" rx="3" fill="#2a2a2a"/>
    <rect x="3" y="11" width="28" height="6" rx="2" fill="#c41818"/>
    <rect x="10" y="7" width="7" height="14" rx="1.5" fill="#e02020"/>
  </g>

  <!-- Lower body: instructions plate. -->
  <rect x="26" y="234" width="98" height="160" fill="url(#orange)"/>
  <rect x="36" y="250" width="78" height="128" rx="2" fill="#f08a3c" stroke="#000" stroke-width="0.8"/>
  <g font-size="7" font-weight="bold" fill="#000">
    <text x="42" y="266">SART</text>
    <text x="42" y="278" font-size="5.5">9 GHz RADAR</text>
    <text x="42" y="286" font-size="5.5">TRANSPONDER</text>
  </g>
  <g font-size="4.5" fill="#000">
    <text x="42" y="300">1 PULL PIN TO</text>
    <text x="42" y="306">  SWITCH ON</text>
    <text x="42" y="316">2 MOUNT ON POLE,</text>
    <text x="42" y="322">  1 m ABOVE SEA</text>
    <text x="42" y="332">3 LAMP FLASHES:</text>
    <text x="42" y="338">  STANDBY</text>
    <text x="42" y="348">4 FAST FLASHES:</text>
    <text x="42" y="354">  RADAR FOUND</text>
  </g>
  <rect x="26" y="388" width="98" height="12" rx="3" fill="#1d1d1d"/>
</svg>
