  <rect x="33" y="31" width="174" height="76" fill="#595959"/>
  <rect x="35" y="33" width="171" height="72" fill="#e3f3e3"/>
  <rect id="face-A" x="38" y="42" width="164" height="58" fill="#fff"/>
  <g font-family="DejaVu Sans" fill="#000">
    <path d="M74.8,82.1 L67.9,76.3" stroke="#000" stroke-width="1.2"/>
    <text x="62.5" y="74.3" font-size="7.5" text-anchor="middle">80</text>
