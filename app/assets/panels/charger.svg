<?xml version="1.0" encoding="UTF-8"?>
<!-- Battery charger. Own drawing on the original's 564 x 167 layout.
     Ids the app uses: face-A, face-V (meter faces; needle pivot 20 below the bottom centre, radius 68,
     scale -50..+50 degrees), lamp-ON, switch (rocker MAN / OFF / AUTO in thirds from the top).
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="564" height="167" viewBox="0 0 564 167" font-family="DejaVu Sans">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa77b"/>
      <stop offset="1" stop-color="#5b8f67"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <radialGradient id="lampOff" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#860004"/>
      <stop offset="1" stop-color="#3a0000"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="564" height="167" rx="4" fill="#000"/>
  <rect x="1" y="1" width="562" height="165" rx="4" fill="url(#face)"/>
  <rect x="10.5" y="9.5" width="544" height="149" rx="3" fill="none" stroke="#e3f3e3" stroke-width="1"/>
  <rect x="12.5" y="11.5" width="540" height="145" rx="2" fill="none" stroke="#597d61" stroke-width="1"/>

  <!-- A meter. -->
