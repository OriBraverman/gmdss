<?xml version="1.0" encoding="UTF-8"?>
<!-- Battery charger. Own drawing on the original's 564 x 167 layout.
     Ids the app uses: face-A, face-V (meter faces 58 high; needle pivot 147.6 below the face's bottom
     centre, scale -23.2..+23.2 degrees at radius 190-204, as measured on the original), lamp-ON,
     switch (rocker MAN / OFF / AUTO in thirds from the top).
     Text uses DejaVu Sans (bundled, see ../fonts). -->
