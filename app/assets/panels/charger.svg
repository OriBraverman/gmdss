      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <radialGradient id="lampOff" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#860004"/>
      <stop offset="1" stop-color="#3a0000"/>
    </radialGradient>
  </defs>
