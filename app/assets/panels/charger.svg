  <!-- ON lamp. -->
  <circle cx="269" cy="41" r="11" fill="#000"/>
  <circle cx="269" cy="41" r="9.5" fill="#595959"/>
  <circle id="lamp-ON" cx="269" cy="41" r="7" fill="url(#lampOff)"/>
  <text x="299" y="44" font-size="7.5" fill="#e3f3e3">ON</text>

  <!-- Rocker switch body; the app draws the rocker. -->
  <rect x="250" y="67" width="44" height="54" rx="3" fill="#597d61"/>
  <rect x="250" y="67" width="40" height="52" rx="3" fill="#000"/>
  <rect id="switch" x="254" y="72" width="32" height="44" rx="2" fill="#414141"/>
  <g font-size="7.5" fill="#e3f3e3">
    <text x="299" y="76">MAN</text>
    <text x="299" y="96">OFF</text>
    <text x="299" y="116">AUTO</text>
  </g>

  <text x="282" y="148" font-size="9" fill="#e3f3e3" text-anchor="middle">BATTERY CHARGER</text>
</svg>
