<?xml version="1.0" encoding="UTF-8"?>
<!-- DSC controller front panel (VHF and MF/HF units). Own drawing on the original's 471 x 225 layout.
     {TITLE} is replaced by the model name when loaded.
     Ids the app uses: knob-VOL_OFF, lcd, key-FUNC key-RX_MSG key-EDIT key-LAST key-Up key-NEXT key-DISTRESS
     key-CALL key-SEND key-Left key-Down key-Right key-0..key-9 key-Dot key-STOP_ENT.
     Text uses DejaVu Sans (bundled, see ../fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" width="471" height="225" viewBox="0 0 471 225"
     font-family="DejaVu Sans">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b68f"/>
      <stop offset="1" stop-color="#7c9f78"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="0.5" stop-color="#ebebf3"/>
      <stop offset="1" stop-color="#cfcfd8"/>
    </linearGradient>
    <linearGradient id="bandEnd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b2b2b2"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebebf3"/>
    </linearGradient>
    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e3e3e3"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </radialGradient>
    <linearGradient id="keyGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lcdGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcc46a"/>
      <stop offset="1" stop-color="#a8b05a"/>
    </linearGradient>
    <g id="keyWell">
      <rect x="-1" y="-1" width="33" height="33" rx="4" fill="#597d61"/>
      <rect x="0" y="0" width="33" height="33" rx="4" fill="#e3f3e3"/>
      <rect x="0" y="0" width="32" height="32" rx="3" fill="#000"/>
      <rect x="2" y="2" width="28" height="14" rx="2" fill="url(#keyGloss)"/>
    </g>
    <g id="screwHead">
      <circle r="8.5" fill="#597d61"/>
      <circle r="7.2" fill="#717171"/>
      <circle r="6.2" fill="url(#screw)"/>
      <path d="M-3.4,-0.9 L3.4,0.9 M-0.9,3.4 L0.9,-3.4" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Frame and face. -->
  <rect x="0" y="0" width="471" height="225" rx="7" fill="#000"/>
  <rect x="2" y="2" width="467" height="221" rx="6" fill="none" stroke="#717171" stroke-width="1"/>
  <rect x="4" y="4" width="463" height="217" rx="5" fill="url(#face)"/>
  <path d="M9,5.5 H462" stroke="#e3f3e3" stroke-width="1.5"/>
  <path d="M5.5,9 V216" stroke="#a6c7a2" stroke-width="1.5"/>
  <path d="M9,219.5 H462 M465.5,9 V216" stroke="#597d61" stroke-width="1.5"/>

  <!-- Title band. -->
  <rect x="5" y="16" width="461" height="12" fill="url(#band)"/>
  <rect x="5" y="16" width="6" height="12" fill="url(#bandEnd)"/>
  <rect x="460" y="16" width="6" height="12" fill="url(#bandEnd)" transform="matrix(-1,0,0,1,926,0)"/>
  <path d="M5,28.5 H466" stroke="#717171" stroke-width="1"/>
  <text x="34" y="25" font-size="8" fill="#000">{TITLE}</text>
  <text x="437" y="25" font-size="8" fill="#000" text-anchor="end">DIGITAL SELECTIVE CALLING</text>

  <use href="#screwHead" x="21" y="21"/>
  <use href="#screwHead" x="450" y="21"/>
  <use href="#screwHead" x="21" y="204"/>
  <use href="#screwHead" x="450" y="204"/>

  <!-- Label strip. -->
  <rect x="35" y="199" width="67" height="16" rx="8" fill="#597d61"/>
  <rect x="34" y="198" width="67" height="16" rx="8" fill="#ebebf3"/>
  <path d="M41,198.6 H94" stroke="#fff" stroke-width="1"/>
  <text x="67.5" y="209" font-size="6" fill="#9a9a9a" text-anchor="middle">DSC</text>

  <!-- Display window stepping down to the two-line LCD. -->
  <rect x="69" y="33" width="247" height="75" fill="#000"/>
  <path d="M70,108.5 H315 M314.5,35 V108" stroke="#a6c7a2" stroke-width="1"/>
  <path d="M71,109.5 H314" stroke="#e3f3e3" stroke-width="1"/>
  <g fill="none" stroke="#717171" stroke-width="1">
    <rect x="75.5" y="35.5" width="234" height="49"/>
    <rect x="77.5" y="37.5" width="230" height="45"/>
    <rect x="79.5" y="39.5" width="226" height="41"/>
  </g>
  <rect id="lcd" x="95" y="43" width="195" height="33" fill="url(#lcdGlass)"/>
  <path d="M95,44 H290 M96,43 V76" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Volume / off knob key. -->
  <g id="knob-VOL_OFF" transform="translate(26,33)">
    <use href="#keyWell"/>
    <text x="4" y="8.5" font-size="6" font-weight="bold" fill="#e3e3e3">VOL</text>
    <text x="5.5" y="17" font-size="5.5" font-weight="bold" fill="#e3e3e3" text-anchor="middle">O</text>
    <text x="5.5" y="23" font-size="5.5" font-weight="bold" fill="#e3e3e3" text-anchor="middle">F</text>
    <text x="5.5" y="29" font-size="5.5" font-weight="bold" fill="#e3e3e3" text-anchor="middle">F</text>
    <circle cx="20" cy="20" r="6.5" fill="none" stroke="#b2b2b2" stroke-width="1"/>
    <path d="M14.5,15 H24 M20,20 L24,25" stroke="#717171" stroke-width="1"/>
  </g>

  <!-- Unused key positions. -->
  <use href="#keyWell" x="26" y="76"/>
  <use href="#keyWell" x="69" y="119"/>
  <use href="#keyWell" x="69" y="162"/>

  <g font-weight="bold">
    <!-- Function keys. -->
    <g id="key-FUNC" transform="translate(26,119)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">FUNC</text></g>
    <g id="key-DISTRESS" transform="translate(26,162)"><use href="#keyWell"/>
      <text transform="translate(16,14) scale(0.85,1)" font-size="8.5" font-weight="normal" fill="#df0000" text-anchor="middle">DIS</text>
      <text transform="translate(16,23) scale(0.85,1)" font-size="8.5" font-weight="normal" fill="#df0000" text-anchor="middle">TRESS</text></g>
    <g id="key-RX_MSG" transform="translate(112,119)"><use href="#keyWell"/>
      <text transform="translate(16,14) scale(0.85,1)" font-size="8.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">RX</text>
      <text transform="translate(16,23) scale(0.85,1)" font-size="8.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">MSG</text></g>
    <g id="key-CALL" transform="translate(112,162)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">CALL</text></g>
    <g id="key-EDIT" transform="translate(155,119)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">EDIT</text></g>
    <g id="key-SEND" transform="translate(155,162)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#df0000" text-anchor="middle">SEND</text></g>
    <g id="key-LAST" transform="translate(198,119)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">LAST</text></g>
    <g id="key-Left" transform="translate(198,162)"><use href="#keyWell"/>
      <path d="M19,9 L12,16 L19,23" fill="none" stroke="#ffeb00" stroke-width="2.6" stroke-linejoin="round"/></g>
    <g id="key-Up" transform="translate(241,119)"><use href="#keyWell"/>
      <path d="M9,19 L16,12 L23,19" fill="none" stroke="#ffeb00" stroke-width="2.6" stroke-linejoin="round"/></g>
    <g id="key-Down" transform="translate(241,162)"><use href="#keyWell"/>
      <path d="M9,13 L16,20 L23,13" fill="none" stroke="#ffeb00" stroke-width="2.6" stroke-linejoin="round"/></g>
    <g id="key-NEXT" transform="translate(284,119)"><use href="#keyWell"/>
      <text transform="translate(16,19.5) scale(0.95,1)" font-size="9.5" font-weight="normal" fill="#ffeb00" text-anchor="middle">NEXT</text></g>
    <g id="key-Right" transform="translate(284,162)"><use href="#keyWell"/>
      <path d="M13,9 L20,16 L13,23" fill="none" stroke="#ffeb00" stroke-width="2.6" stroke-linejoin="round"/></g>

    <!-- Numeric keys: letters (green) above, digit (yellow) bottom right. -->
    <g id="key-1" transform="translate(327,33)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">ABC</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">1</text></g>
    <g id="key-2" transform="translate(370,33)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">DEF</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">2</text></g>
    <g id="key-3" transform="translate(413,33)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">GHI</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">3</text></g>
    <g id="key-4" transform="translate(327,76)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">JKL</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">4</text></g>
    <g id="key-5" transform="translate(370,76)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">MNO</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">5</text></g>
    <g id="key-6" transform="translate(413,76)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">PQR</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">6</text></g>
    <g id="key-7" transform="translate(327,119)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">STU</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">7</text></g>
    <g id="key-8" transform="translate(370,119)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">VWX</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">8</text></g>
    <g id="key-9" transform="translate(413,119)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#00ebb2">YZ-</text>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">9</text></g>
    <g id="key-Dot" transform="translate(327,162)"><use href="#keyWell"/>
      <text x="4" y="9" font-size="6" fill="#ffeb00">DEG</text>
      <text transform="translate(26,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">.</text></g>
    <g id="key-0" transform="translate(370,162)"><use href="#keyWell"/>
      <text transform="translate(28,29) scale(0.72,1)" font-size="19" fill="#ffeb00" text-anchor="end">0</text></g>
    <g id="key-STOP_ENT" transform="translate(413,162)"><use href="#keyWell"/>
      <text transform="translate(29,9) scale(0.85,1)" font-size="6.5" font-weight="normal" fill="#ffeb00" text-anchor="end">STOP</text>
      <text transform="translate(29,28) scale(0.85,1)" font-size="11" font-weight="normal" fill="#ffeb00" text-anchor="end">ENT</text></g>
  </g>
</svg>
