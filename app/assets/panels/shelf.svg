<?xml version="1.0" encoding="UTF-8"?>
<!-- A wooden book shelf (the Books page draws the books). Own drawing, 613 x 172.
     Id the app uses: space (where the books stand). -->
<svg xmlns="http://www.w3.org/2000/svg" width="613" height="172" viewBox="0 0 613 172">
  <defs>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2e12"/>
      <stop offset="0.35" stop-color="#8a4a20"/>
      <stop offset="1" stop-color="#4a250e"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a25c28"/>
      <stop offset="0.4" stop-color="#7c4119"/>
      <stop offset="1" stop-color="#4a250e"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140d08"/>
      <stop offset="1" stop-color="#24170d"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="613" height="172" fill="url(#back)"/>
  <rect id="space" x="40" y="6" width="533" height="128" fill="url(#back)"/>
  <!-- Side posts with a little grain. -->
  <rect x="0" y="0" width="40" height="172" fill="url(#post)"/>
  <rect x="573" y="0" width="40" height="172" fill="url(#post)"/>
  <path d="M8,10 Q12,60 9,120 M18,0 Q22,80 17,172 M30,20 Q27,90 31,150" fill="none" stroke="#3a1c08" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M581,10 Q585,60 582,120 M591,0 Q595,80 590,172 M603,20 Q600,90 604,150" fill="none" stroke="#3a1c08" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Board. -->
  <rect x="0" y="134" width="613" height="34" fill="url(#board)"/>
  <path d="M0,134.5 H613" stroke="#c07a40" stroke-width="1.5"/>
  <path d="M30,150 Q120,146 220,152 T420,149 T600,151 M60,160 Q200,157 340,161 T590,159" fill="none" stroke="#3a1c08" stroke-width="1" stroke-opacity="0.5"/>
  <ellipse cx="190" cy="153" rx="9" ry="3" fill="#3a1c08" fill-opacity="0.6"/>
  <ellipse cx="445" cy="156" rx="7" ry="2.5" fill="#3a1c08" fill-opacity="0.6"/>
  <rect x="0" y="168" width="613" height="4" fill="#2a1508"/>
</svg>
